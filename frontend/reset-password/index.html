<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>FamilyShield - Reset Password</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: Inter, ui-sans-serif, system-ui, sans-serif;
      background: #0e1210;
      color: #f5f7f4;
    }
    .loader {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }
    .spinner {
      width: 48px;
      height: 48px;
      border: 3px solid rgba(255,255,255,0.15);
      border-top-color: #34d399;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    p { color: #aeb9b4; font-weight: 600; }
  </style>
</head>
<body>
  <div class="loader">
    <div class="spinner"></div>
    <p>Preparing password reset...</p>
  </div>
  <script>
    (function() {
      var params = new URLSearchParams(window.location.search);
      var token = params.get("token");
      if (token) {
        window.location.replace("/?reset=1&token=" + encodeURIComponent(token));
      } else {
        window.location.replace("/");
      }
    })();
  </script>
</body>
</html>

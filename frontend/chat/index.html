<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FamilyShield - Family Chat</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../styles.css?v=v8" />
  <link rel="stylesheet" href="./chat.css?v=v8" />
</head>
<body class="chat-body">
  <div class="chat-container">

    <!-- Header -->
    <header class="chat-header">
      <a href="../" class="back-btn">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <path d="m15 18-6-6 6-6"/>
        </svg>
        <span>My Family</span>
      </a>
      <div class="chat-info">
        <h2 id="family-name">Family Chat</h2>
        <div class="online-status">
          <span class="online-dot"></span>
          <span id="member-count">Loading...</span>
        </div>
      </div>
      <div class="chat-actions">
        <button class="ghost-icon" id="search-toggle-btn" type="button" title="Search messages" aria-label="Search messages">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        </button>
        <button class="ghost-icon" id="theme-toggle-chat" type="button" title="Toggle theme" aria-label="Toggle theme">
          <span class="theme-icon">◐</span>
        </button>
      </div>
    </header>

    <!-- Search Bar -->
    <div class="chat-search-bar hidden" id="chat-search-bar">
      <input type="text" id="chat-search-input" placeholder="Search messages..." autocomplete="off">
      <button class="search-close-btn" id="search-close-btn" type="button">&times;</button>
    </div>

    <!-- Online Users Bar -->
    <div class="online-bar" id="online-bar">
      <div class="online-users" id="online-users">
        <!-- Populated by JS -->
      </div>
    </div>

    <!-- Messages Area -->
    <div class="messages-container" id="messages">
      <div class="messages-loading" id="messages-loading">
        <div class="spinner"></div>
        <span>Loading messages...</span>
      </div>
      <div class="load-more-spinner hidden" id="load-more-spinner">
        <div class="spinner"></div>
      </div>
      <div class="messages-list" id="messages-list">
        <!-- Messages populated by JS -->
      </div>
      <div class="typing-indicator hidden" id="typing-indicator">
        <span class="typing-dots">
          <span></span><span></span><span></span>
        </span>
        <span id="typing-user">Someone</span> is typing...
      </div>
    </div>

    <!-- Input Area -->
    <div class="chat-input-area">
      <div class="image-preview hidden" id="image-preview">
        <img id="preview-img" src="" alt="Preview">
        <button class="remove-preview" id="remove-preview">×</button>
      </div>
      <div class="chat-input">
        <button class="input-action" id="attach-btn" type="button" title="Attach image" aria-label="Attach image">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <rect x="3" y="3" width="18" height="18" rx="2"/>
            <circle cx="8.5" cy="8.5" r="1.5"/>
            <path d="m21 15-5-5L5 21"/>
          </svg>
        </button>
        <input type="file" id="file-input" accept="image/*" hidden>
        <input type="text" id="message-input" placeholder="Type a message..." autocomplete="off">
        <button class="send-btn" id="send-btn" type="button" title="Send message" aria-label="Send message">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <line x1="22" y1="2" x2="11" y2="13"/>
            <polygon points="22 2 15 22 11 13 2 9 22 2"/>
          </svg>
        </button>
      </div>
    </div>

  </div>

  <script src="./chat.js?v=v10" type="module"></script>
</body>
</html>
